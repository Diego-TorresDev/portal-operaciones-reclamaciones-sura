# Nombre que Spring Boot asigna a nuestra aplicación.
spring.application.name=portal-reclamaciones

# Conexion con PostgreSQL.
# La URL y el usuario permiten cambiar la conexion mediante variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sura_reclamaciones}
spring.datasource.username=${DB_USERNAME:postgres}

# La contraseña debe existir en la variable de entorno DB_PASSWORD.
# No guardamos contraseñas reales dentro de este archivo.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA utiliza Hibernate para trabajar con las tablas desde Java.
# Flyway será responsable de crear y modificar el esquema de la base de datos.
# Hibernate solo comprobará que las entidades coincidan con las tablas existentes.
spring.jpa.hibernate.ddl-auto=validate

# Evita mantener abierto el contexto de persistencia durante toda una petición web.
spring.jpa.open-in-view=false

# Puerto HTTP del backend.
server.port=8080

# Clave utilizada para validar firmas JWT.
# Debe estar definida en el entorno de la terminal que inicia Spring Boot.
app.jwt.secret=${JWT_SECRET}

# Flyway aplica las migraciones SQL versionadas al iniciar la aplicación.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Solo crea las cuentas de demostración cuando se activa desde el entorno.
app.bootstrap-users.enabled=${APP_BOOTSTRAP_USERS_ENABLED:false}

# Impide restablecer contraseñas, salvo autorización explícita para hacerlo.
app.bootstrap-users.reset-passwords=${APP_RESET_DEMO_PASSWORDS:false}

# CORS: origen autorizado para las llamadas de navegador a la API.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:8080}

# Límites de solicitudes por minuto y dirección IP.
app.rate-limit.api-per-minute=${API_RATE_LIMIT_PER_MINUTE:120}
app.rate-limit.login-per-minute=${LOGIN_RATE_LIMIT_PER_MINUTE:10}